dding:10px;background:#fff}#darami-app input[type=range]{padding:0;accent-color:var(--green);min-height:34px;border:0}#darami-app input[type=checkbox]{width:20px;height:20px;flex-shrink:0;accent-color:var(--green)}#darami-app label{display:block;margin:10px 0 4px}#darami-app .check{display:flex;align-items:center;gap:10px}#darami-app .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}#darami-app .amount{font-weight:750;font-variant-numeric:tabular-nums}#darami-app table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}#darami-app td,#darami-app th{padding:8px 5px;border-bottom:1px solid #e3e7df;text-align:left;overflow-wrap:anywhere}#darami-app td:last-child{text-align:right}#darami-app .progress{height:6px;background:#e6e9dd;border-radius:6px;overflow:hidden;margin:18px 0}#darami-app .progress i{display:block;background:var(--green);height:100%}#darami-app .bar{display:flex;height:24px;border-radius:6px;overflow:hidden;background:#e9ecdf;margin:7px 0}#darami-app .bar span{min-width:0}#darami-app .need{background:#91b6a2}#darami-app .want{background:#edbd91}#darami-app .save{background:#b0a9d0}#darami-app .legend{font-size:13px;display:flex;gap:14px;flex-wrap:wrap}#darami-app .legend i{display:inline-block;width:10px;height:10px;margin-right:4px}#darami-app .goal{border-top:1px solid #e4e8de;padding:12px 0}#darami-app .error{color:#8b3c26;font-weight:650}#darami-app .success{color:#2e684b;font-weight:650}#darami-app .footer{font-size:12px;color:#64705f;margin-top:24px}#darami-app .ghost{background:transparent;border:0;font-size:13px;min-height:44px}#darami-app .receipt{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 system-ui;max-height:500px;overflow:auto}#darami-app :focus-visible{outline:3px solid #c18c48;outline-offset:3px}@media(max-width:400px){#darami-app{padding:18px 12px}#darami-app h1{font-size:27px}#darami-app .panel{padding:13px}#darami-app td,#darami-app th{padding:7px 3px}}

:focus-visible{outline:3px solid #e59326;outline-offset:3px}button{touch-action:manipulation} .budget-tools{display:flex;flex-wrap:wrap;gap:6px}.budget-tools button{flex:1;padding:6px!important;font-size:13px!important}#dialog{max-height:calc(var(--view-height,100dvh) - 44px);overflow:auto;bottom:auto;top:calc(var(--view-top,0px) + var(--view-height,100dvh) - min(45vh,280px));max-height:min(45vh,280px)}#dialog .dname{position:static;display:inline-block}#dialog .dnext{color:#f2c14e;background:#1d2440;border:2px solid #f4f1e6;min-height:44px;width:100%;font:inherit}#panel,#title,#ending{top:var(--view-top,0px);height:var(--view-height,100dvh);bottom:auto}#panel .sheet{width:100%;box-sizing:border-box}#panel-close{background:#1d2440}#title .card{box-sizing:border-box}#text-open{min-height:44px;width:100%;margin-top:12px}#mission-open{max-width:120px} .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-height:450px){#dialog{top:calc(var(--view-top,0px) + 12px);max-height:calc(var(--view-height,100dvh) - 24px)}#title-sprite{width:54px;height:72px}#title h1{font-size:22px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script>
(()=>{'use strict';
/* ================= 원본 계산·미션 로직 (2D 버전과 동일) ================= */

function receipt(p){return `<table><tbody><tr><th>세전 월급</th><td>${won(p.gross)}</td></tr>${p.rows.map(r=>`<tr><td>${r[0]}</td><td>${won(r[1])}</td></tr>`).join('')}<tr><th>공제 합계</th><td>${won(p.total)}</td></tr><tr><th>실수령액</th><td><strong>${won(p.net)}</strong></td></tr></tbody></table><p class="small">항목별 원 미만 버림. 소득세·지방소득세는 실제 간이세액표가 아닌 교육용 보간 모델. 산재보험은 사업주 부담입니다.</p>`;}
function start(){return `<div class="hero">${mascot()}<p class="kicker">스무 살, 첫 돈 공부</p><h1>작은 도토리가<br>10년 뒤의 나에게</h1><p>월급부터 첫 저축까지.<br>다람이와 함께 내 돈의 길을 정해 봐요.</p></div><label for="nickname">게임에서 쓸 별명</label><input id="nickname" maxlength="20" placeholder="예: 알뜰 다람" value="${esc(state.name)}"><p class="small">실명 대신 별명을 써요. 약 25~35분 · 계산기 사용 가능</p><div class="choices"><button data-career="job"><strong>취업 다람</strong>세전 월급 2,500,000원</button><button data-career="student"><strong>대학생 다람</strong>주 15시간 알바 + 주휴수당 3시간분<br>주급 192,600원 × 4.345 = 월 ${won(Calc.grossStudent())}</button></div><p class="small">수업용 2027년 가정: 최저시급 10,700원, 주 40시간 월 환산 2,236,300원(209시간). 학생 진로는 보험 가입 조건을 생략하고 같은 근로자 부담 보험료율을 적용한 비교 모델입니다.</p>`;}
function payroll(){let p=Calc.payroll(state.career==='job'?2500000:Calc.grossStudent());if(state.answers.payroll!==undefined)return receipt(p)+explanation([`내 예상 ${won(state.guess||0)} → 교육용 추정 ${won(p.net)}.`,`공제액 = 세전 월급 × 각 항목의 비율. 장기요양은 건강보험료가 기준이에요.`,`주휴수당은 주 소정근로시간 15시간 이상, 소정근로일 개근 등 요건을 충족할 때 받아요.`,`주 15시간 알바의 수업용 주휴시간은 3시간: 10,700 × (15＋3).`],state.rewards[1])+nextButton();return `<p>세전 ${won(p.gross)}, 통장에는 얼마나 들어올까요?</p><label for="guess">예상 실수령액 <strong id="guess-value">${won(state.guess??floor(p.gross*.9/10000)*10000)}</strong></label><input id="guess" type="range" min="0" max="${p.gross}" step="10000" value="${state.guess??floor(p.gross*.9/10000)*10000}">${state.revealed?receipt(p):button('명세서 열기','reveal',true)}${state.revealed?`<h3>주휴수당, 언제 받을까요?</h3>${qButtons(['한 시간만 일해도 무조건 받는다','주 15시간 이상 + 개근 등 지급 요건을 충족한다','주 40시간인 사람만 받는다'],'payroll')}`:''}`;}
function ratioBars(){let a=amounts(),v=[sum(a.slice(0,4)),a[4],a[5]+a[6]],pct=v.map(x=>x/net()*100);return `<div class="legend"><span><i class="need"></i>필요</span><span><i class="want"></i>욕구</span><span><i class="save"></i>저축·비상금</span></div><p class="small">내 예산 ${pct.map(x=>x.toFixed(1)+'%').join(' / ')}</p><div class="bar">${pct.map((x,i)=>`<span class="${['need','want','save'][i]}" style="width:${Math.max(0,x)}%"></span>`).join('')}</div><p class="small">참고 기준 50% / 30% / 20%</p><div class="bar"><span class="need" style="width:50%"></span><span class="want" style="width:30%"></span><span class="save" style="width:20%"></span></div>`;}
function budgetEditor(){return '<p>교육용 추정 실수령액 '+won(net())+'을 배분해요. 원 단위 직접 입력과 ±1만 원 조절이 가능합니다.</p><div class="panel">'+cats.map((c,i)=>`<label for="budget-${i}">${c} (원)</label><input id="budget-${i}" data-budget="${i}" type="number" min="0" max="${net()}" step="1" value="${state.budget[i]}"><div class="budget-tools"><button type="button" data-adjust="${i}" data-delta="-10000" aria-label="${c} 1만 원 줄이기">−1만 원</button><button type="button" data-adjust="${i}" data-delta="10000" aria-label="${c} 1만 원 늘리기">+1만 원</button><button type="button" data-fill="${i}">남은 금액을 ${c}에</button></div>`).join('')+'</div><div id="budget-live" role="status"></div>';}
function budget(){if(state.answers.budget!==undefined)return budgetTable()+ratioBars()+explanation(['첫 예산 선택 기록은 보존되며 마지막 계획서에서 현재 예산을 수정할 수 있어요.'],state.rewards[2])+nextButton();return budgetEditor()+button('배분 완료','budget-done',true);}
function updateBudget(){let left=net()-sum(amounts()),el=root.querySelector('#budget-live');if(el)el.innerHTML=`<p class="${left<0?'error':'amount'}">${left<0?'초과':'남은 돈'} ${won(Math.abs(left))}</p>${ratioBars()}`;let b=root.querySelector('[data-action="budget-done"]');if(b)b.disabled=left!==0;}
function saving(){let m=amounts()[5],r=Calc.installment(m);if(state.answers.saving!==undefined)return explanation([`매월 초 ${won(m)}씩 12개월: 세전 이자 ${won(r.gross)}.`,`이자 = ${m.toLocaleString()} × 0.05 × (1＋…＋12) ÷ 12.`,`등차수열의 합 12 × 13 ÷ 2 = 78. 각 납입금의 운용 기간이 달라요.`,`이자소득세 ${won(r.tax)}를 빼면 세후 이자 ${won(r.net)}.`],state.rewards[3])+nextButton();let vals=m===0?[0,15000,30000,97500]:[floor(m*.05*12),r.gross,floor(m*.05),r.net];state.savingOptions=vals;return `<p>매월 초 <strong>${won(m)}</strong>씩 연 5% 단리 적금에 12개월 넣으면 세전 이자는?</p><p class="small">첫 납입금 12개월, 마지막 납입금 1개월 운용. ${m===0?'저축이 0원이면 이자도 0원입니다.':''}</p>${qButtons(vals.map(won),'saving')}`;}
function graph(){let m=state.chartMonthly,r=state.chartRate,values=Array.from({length:11},(_,y)=>Calc.future(m,r,y*12));let W=500,H=245,L=65,T=22,B=40,R=20,max=Math.max(1,values[10].net);let x=y=>L+y*(W-L-R)/10,y=v=>H-B-v/max*(H-T-B);let path=key=>values.map((v,i)=>(i?'L':'M')+x(i)+','+y(v[key])).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="10년 저축 비교. 그냥 모으기 ${won(values[10].principal)}, 세후 복리 ${won(values[10].net)}" style="width:100%;height:auto"><text x="6" y="16" font-size="13" fill="#35433c">금액 (만원)</text>${[0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(max*v)}" y2="${y(max*v)}" stroke="#dee5d8"/><text x="${L-8}" y="${y(max*v)+4}" text-anchor="end" font-size="13" fill="#35433c">${(max*v/10000).toFixed(0)}</text>`).join('')}${[0,5,10].map(v=>`<text x="${x(v)}" y="${H-17}" text-anchor="middle" font-size="14" fill="#35433c">${v}년</text>`).join('')}<path d="${path('principal')}" fill="none" stroke="#b18461" stroke-width="3" stroke-dasharray="6 4"/><path d="${path('net')}" fill="none" stroke="#34654e" stroke-width="4"/></svg><p>점선 · 그냥 모으기 <strong>${won(values[10].principal)}</strong><br>실선 · 세후 복리 <strong>${won(values[10].net)}</strong></p>`;}
function compound(){if(state.answers.compound===undefined)return `<p>연 6% 복리라면 돈이 2배가 되는 데 대략 몇 년이 걸릴까요?</p>${qButtons(['6년','12년','72년'],'compound')}`;return explanation(['72 ÷ 6 = 약 12년. 실제로는 (1.06)ⁿ = 2를 풀어요.','n = log 2 ÷ log 1.06 ≈ 11.9년: 로그는 지수에 있는 시간을 찾아줘요.','원금 × (1＋r)ⁿ은 등비수열. 이자에도 이자가 붙는 것이 복리예요.','아래 그래프는 매월 말 저축, 연이율÷12로 월 복리, 만기 이자세 15.4%를 가정해요.'],state.rewards[4])+`<label for="chart-monthly">월 저축액 <strong id="chart-monthly-label">${won(state.chartMonthly)}</strong></label><input id="chart-monthly" type="range" min="0" max="${floor(net()/10000)*10000}" step="10000" value="${state.chartMonthly}"><label for="chart-rate">연 수익률 <strong id="chart-rate-label">${state.chartRate}%</strong></label><input id="chart-rate" type="range" min="0" max="8" step="0.5" value="${state.chartRate}"><div id="chart">${graph()}</div><p class="small">그래프 실험값은 실제 예산을 바꾸지 않습니다. 수익률은 수업용 가정이며 매월 이자는 원 미만 버립니다.</p>${nextButton()}`;}
/* 주식 첫걸음: 기본 개념 → 수익률은 곱한다(기하평균) → 나눠 담기(분산투자) */
function stockBasics(){return `<section class="panel"><h3>주식 기본 개념 4가지</h3><div class="term"><h3>① 주식은 회사의 작은 조각</h3><p>회사를 아주 많은 조각으로 나눈 것이 주식이에요. 1주를 사면 그 회사의 작은 주인, 곧 주주가 돼요.</p></div><div class="term"><h3>② 돈을 버는 두 가지 방법</h3><p><b>시세차익</b>: 산 값보다 비싸게 팔 때 생기는 이익이에요. 주가 20,000원 × 5주 = 100,000원어치가 주가 10% 상승으로 110,000원이 돼요.<br><b>배당</b>: 회사가 번 이익의 일부를 주주에게 나눠 주는 돈이에요. 주지 않는 회사도 있어요.</p></div><div class="term"><h3>③ 주가는 왜 오르내릴까?</h3><p>회사 실적, 경제 상황, 사람들의 기대가 바뀌면 사려는 사람과 팔려는 사람의 수가 달라져 가격이 움직여요. 내일 가격은 누구도 정확히 알 수 없어요.</p></div><div class="term"><h3>④ 예금·적금과 다른 점</h3><p>예금·적금은 약속된 이자를 주고 예금자보호 제도로 한도 안에서 보호돼요. 주식은 <b>원금이 보장되지 않아요</b>. 산 값보다 떨어진 채 팔면 손실이에요. 기대 수익이 클수록 보통 가격의 흔들림, 곧 위험도 커요.</p></div></section>`;}
function stockBasket(){const pick=state.stockPick,value=r=>floor(1000000*(100+r)/100),mix=sum(STOCKS.map(([,r])=>floor(200000*(100+r)/100)));
 if(pick===undefined)return `<section class="panel"><h3>바구니 실험: 한곳에 담을까, 나눠 담을까?</h3><p>가상 회사 5곳 중 <b>한 곳에 100만 원</b>을 모두 넣는다면 어디를 고를까요? 1년 수익률은 고른 뒤에 공개돼요.</p><div class="choices">${STOCKS.map(([name],i)=>`<button type="button" data-pick="${i}">${esc(name)}</button>`).join('')}</div><p class="small">회사 이름과 수익률은 수업용 가상 자료예요. 고른 회사는 도토리 점수와 관계없어요.</p></section>`;
 const vals=STOCKS.map(([,r])=>value(r)),hi=Math.max(...vals),lo=Math.min(...vals);
 return `<section class="panel"><h3>바구니 실험 결과 · 1년 뒤</h3><table><thead><tr><th>회사</th><th>수익률</th><th>100만 원 → </th></tr></thead><tbody>${STOCKS.map(([name,r],i)=>`<tr${i===pick?' style="font-weight:700"':''}><td>${i===pick?'▶ ':''}${esc(name)}</td><td>${r>0?'+':r<0?'−':''}${Math.abs(r)}%</td><td>${won(vals[i])}</td></tr>`).join('')}<tr><th>5곳에 20만 원씩 나눠 담기</th><th>${mix>=1000000?'+':''}${((mix-1000000)/10000).toFixed(0)}%</th><th>${won(mix)}</th></tr></tbody></table>${[`내가 고른 ${esc(STOCKS[pick][0])}: ${won(vals[pick])}. 한 곳에 담으면 결과가 최고 ${won(hi)}부터 최저 ${won(lo)}까지, ${won(hi-lo)}나 벌어져요.`,`나눠 담기: 200,000 × (1.36＋1.14＋1.06＋0.94＋0.70) = ${won(mix)}. 수익률의 평균 (36＋14＋6−6−30) ÷ 5 = 4%와 같아요.`,'나눠 담으면 한 회사의 큰 손실을 다른 회사가 메워 결과의 흔들림이 줄어요. 대신 최고 결과도 포기해요.','시장 전체가 떨어지면 나눠 담아도 손실이 날 수 있어요. 분산투자는 위험을 <b>줄이는</b> 방법이지 <b>없애는</b> 방법이 아니에요. 여러 회사를 한 번에 담는 펀드·ETF도 같은 원리예요.'].map(t=>`<p>${t}</p>`).join('')}<div class="note"><h3>투자 전에 확인할 것</h3><div>① 비상금을 먼저 마련했나요? 곧 써야 할 돈은 넣지 않아요.</div><div>② 잃어도 생활이 흔들리지 않는 돈인가요?</div><div>③ '무조건 오른다', '원금 보장 고수익'이라는 말은 의심해요.</div></div></section>`;}
function stock(){if(state.answers.stock===undefined)return `${stockBasics()}<h3>수익률 퀴즈</h3><p>도토리 100개로 가상 회사 주식을 샀어요. 첫해 주가가 <b>50% 하락</b>하고, 다음 해 <b>50% 상승</b>했다면 2년 뒤 도토리는 몇 개일까요?</p>${qButtons(['100개 · 평균 수익률이 0%니까','75개','125개'],'stock')}`;
 return `<details><summary>주식 기본 개념 다시 보기</summary>${stockBasics()}</details>${explanation(['100 × 0.5 × 1.5 = 75개. 수익률은 더하지 않고 (1＋수익률)을 곱해요.','−50%와 +50%의 산술평균은 0%지만, 실제 연평균 수익률은 √0.75 − 1 ≈ −13.4%예요. 이것이 기하평균이에요.','반토막 난 뒤 원금을 되찾으려면 +100%가 필요해요: 1 ÷ 0.5 = 2배.','복리 그래프는 수익률이 매년 같다고 가정했어요. 주식 수익률은 해마다 달라서 미래 금액을 보장할 수 없어요.'],state.rewards[5])}${stockBasket()}${state.stockPick===undefined?'':nextButton()}`;}
function card(){if(state.answers.card===undefined)return `<div class="hero">${mascot()}<h3>마음에 쏙 드는 패딩, 600,000원!</h3></div><p>네 가지 선택의 비용을 비교해 볼까요?</p>${qButtons(['일시불로 산다','6개월 무이자 할부','리볼빙 · 매달 청구액의 10%만 결제','3개월 모아서 산다'],'card')}`;let rv=Calc.revolving();return `<p>나의 선택: <strong>${['일시불','6개월 무이자 할부','리볼빙','3개월 모아서 사기'][state.answers.card]}</strong></p><table><thead><tr><th>방법</th><th>총비용</th><th>6개월 뒤 빚</th></tr></thead><tbody><tr><td>일시불</td><td>600,000원</td><td>0원</td></tr><tr><td>무이자 6개월<br>월 100,000원</td><td>600,000원</td><td>0원</td></tr><tr><td>리볼빙</td><td>${won(rv.total)}<br>${rv.months}개월</td><td>${won(rv.six.balance)}</td></tr><tr><td>3개월 저축<br>월 200,000원</td><td>600,000원</td><td>0원</td></tr></tbody></table><p class="small">리볼빙: 월 이자 = 전월 잔액 × 18% ÷ 12(버림), 결제액 = (잔액＋이자)의 10%(원 단위 올림). 청구액이 1만 원 이하면 전액 상환합니다. 6개월 납부액 ${won(rv.six.paid)}. 추가 구매·수수료·연체 없음. 가상 결제·상환 조건이며 실제 카드사 청구서 재현이 아닙니다. 카드 비용은 기본 장기 전망에 자동 반영되지 않습니다.</p>${explanation(['무이자 할부도 미래 월급에서 빠져나갈 지출이에요.','리볼빙 잔액은 대략 전월 잔액 × 1.015 × 0.9: 비율이 반복돼요.','총비용에는 원금과 이자를 모두 포함해야 해요.','3개월 모으기는 월 20만 원을 마련할 예산 조정이 필요해요.'],state.rewards[6])}${nextButton()}`;}
function emergency(){if(!state.event){state.event=[{name:'폰 액정 수리',cost:300000},{name:'사랑니 치료',cost:250000},{name:'노트북 수리',cost:450000}][floor(Math.random()*3)];persist();}let e=state.event,reserve=amounts()[6]*3,short=Math.max(0,e.cost-reserve),loan=Calc.loan(short),living=sum(amounts().slice(0,4));if(state.answers.emergency===undefined)return `<div class="hero">${mascot(short>0)}</div><h3>${e.name} ${won(e.cost)}</h3><p>매월 비상금 ${won(amounts()[6])}을 3개월 쌓았다면 ${won(reserve)}!</p><div class="note ${short?'warning':''}">${short?`부족액 ${won(short)}은 연 18%, 12개월 원금균등상환 대출로 가정합니다.<br>예상 이자 ${won(loan.interest)}, 총상환 ${won(loan.total)}.`:'비상금으로 해결! 남은 비상금 '+won(reserve-e.cost)}</div><p class="small">이번 사건의 비상금은 ‘월 비상금 적립액 × 3’입니다. 장기 목표인 ‘생활비 3~6개월분’과 구분해요.</p><h3>파킹통장은 어떤 돈에 어울릴까요?</h3>${qButtons(['갑자기 꺼낼 수 있는 비상금','10년 동안 절대 안 꺼낼 돈만','언제나 최고 수익을 보장하는 투자금'],'emergency')}`;return explanation([`${e.name} ${won(e.cost)}: ${short?'부족액 '+won(short)+' 대출, 총상환 '+won(loan.total):'비상금으로 해결'}.`,`필요 생활비 ${won(living)} 기준 비상금 목표는 ${won(living*3)}~${won(living*6)}.`,`생활비 × 3~6이라는 비율로 비상금 목표를 정해요.`,`파킹통장은 수시 입출금이 가능한 돈 보관용 계좌를 뜻해요. 금리·조건은 확인해야 해요. 카드·돌발 사건 비용은 기본 장기 전망에 자동 반영되지 않습니다.`],state.rewards[7])+nextButton();}
function future(){let m=amounts()[5],f=Calc.future(m,Assumptions.futureRate),score=totalScore(),title=scoreTitle(score);if(state.answers.future===undefined)return `<p>지금처럼 매달 ${won(m)}씩 10년 저축한다면?</p>${qButtons(['복리는 이자에도 이자가 붙는다','수익률 3%는 언제나 보장된다','비상금과 목표 저축은 같은 돈으로 중복 계산해도 된다'],'future')}`;return `<div class="hero">${mascot()}<span class="badge">${title}</span><h2>10년 뒤의 도토리</h2><p class="amount" style="font-size:30px">${won(f.net)}</p><p>원금 ${won(f.principal)} + 세후 이자 ${won(f.net-f.principal)}</p></div>${explanation(['매월 말 저축, 연 3%를 월 복리로 환산하고 이자세 15.4%를 뺐어요.','반복 저축은 등비수열의 합으로 볼 수 있어요: m × {(1＋i)¹²⁰−1} ÷ i.','실제 계산에서는 매월 이자를 버림하므로 공식값과 조금 달라요.',`이 금액은 목표 저축만의 전망입니다. ${MODEL_NOTE} 비상금은 별도로 관리해야 해요.`],state.rewards[8])}<p class="small">기본 전망: 임금·물가 변화 및 출금 없음. 수익률은 보장되지 않습니다. 사건 지출을 반영하려면 다음 계획서의 월 저축 예산을 현실적으로 조정하세요.</p>${nextButton()}`;}

const rules=['월급을 받으면 먼저 저축하기','리볼빙 전에 총비용 계산하기','생활비 3~6개월분 비상금 준비하기','투자는 나눠 담고 원금 손실 가능성 확인하기'];
function planText(){let g=state.goals.map((g,i)=>`${[1,3,10][i]}년 목표: ${g.title||'(미작성)'} / ${won(g.amount)} / ${g.months}개월 / 월 ${won(Calc.goal(g.amount,g.months))}`);let needed=sum(state.goals.map(g=>Calc.goal(g.amount,g.months)));return ['나의 재무계획서 (수업용 2027년 가정)',`진로: ${state.career==='job'?'취업':'대학생 알바'}`,`세전 월급: ${won(state.career==='job'?2500000:Calc.grossStudent())}`,`월 실수령액: ${won(net())} (소득세 교육용 보간 모델)`,`목표: 현재 자산·이자 제외. ${MODEL_NOTE}`,...g,`월 저축 충족률: ${needed?Math.round(amounts()[5]/needed*100):100}% / 목표 월 저축액 합계: ${won(needed)} / 월 저축 예산: ${won(amounts()[5])} / ${needed<=amounts()[5]?'가능':'조정 필요'}`,'월 예산',...cats.map((c,i)=>`${c}: ${won(amounts()[i])}`),'돈 원칙',...state.rules.map(i=>rules[i]),...(state.customRule.trim()?[state.customRule.trim()]:[]),`다짐: ${state.pledge}`,'10년 저축 전망: '+won(Calc.future(amounts()[5],Assumptions.futureRate).net)+' (매월 말 납입, 연 3%/12 월 복리, 월 이자 버림, 만기 이자세 15.4%, 사건 비용·비상금 제외)','주식 첫걸음: 주식은 원금 보장 없음. −50% 뒤 +50%는 원금의 75%. 가상 회사 5곳에 나눠 담기 +4%'+(state.stockPick!==undefined?` / 한 곳 선택(${STOCKS[state.stockPick][0]}) ${STOCKS[state.stockPick][1]>0?'+':STOCKS[state.stockPick][1]<0?'−':''}${Math.abs(STOCKS[state.stockPick][1])}%`:''),`카드 선택: ${['일시불','6개월 무이자 할부','리볼빙','3개월 모아 사기'][state.answers.card]}`,`돌발 사건: ${state.event?.name||''} ${won(state.event?.cost||0)}`,'소득세·보험료는 수업용 가정이며 실제 제도 확인 필요. 별명과 학번 등 개인정보는 AI에 전달하지 않음.'].join('\n');}
function plan(){if(state.complete)return `<div class="hero">${mascot()}<h2>내 돈의 첫 지도가 완성됐어요!</h2></div><div class="panel"><pre class="receipt">${esc(planText())}</pre></div>${button('계획서 텍스트 복사','copy',true)}<div id="copy-status" role="status"></div>${button('계획서 다시 편집','edit-plan')}<p class="small">2차시에 학교에서 허용한 AI에 붙여 넣으세요. 실명·학교·계좌번호는 넣지 않아요.</p><details><summary>첫 미션 선택 기록 (현재 계획과 별도)</summary><table><thead><tr><th>단계</th><th>선택·결과</th><th>도토리</th></tr></thead><tbody>${Object.entries(state.records).map(([k,v])=>`<tr><td>${names[k]}</td><td>${esc(v.choice)}<br>${esc(v.result)}</td><td>${state.rewards[k]}</td></tr>`).join('')}</tbody></table></details>`;return `<p>게임에서 정한 예산을 목표와 연결해 보세요.</p><p class="small">목표 월 저축액 = 목표 금액 ÷ 개월 수, 원 미만 올림. 현재 모은 돈과 이자는 제외합니다. ${MODEL_NOTE}</p>${state.goals.map((g,i)=>`<div class="goal"><h3>${[1,3,10][i]}년 뒤 · ${g.months}개월</h3><label for="goal-title-${i}">목표</label><input id="goal-title-${i}" data-goal-title="${i}" maxlength="60" placeholder="예: 독립 준비금" value="${esc(g.title)}"><label for="goal-amount-${i}">필요한 금액 (원)</label><input id="goal-amount-${i}" data-goal-amount="${i}" type="number" min="0" max="1000000000" step="10000" value="${g.amount}"><p id="goal-result-${i}" class="small"></p></div>`).join('')}<div id="goal-total" class="note" aria-live="polite"></div><h3>나의 월 예산 (현재 계획)</h3>${budgetEditor()}<h3>나의 돈 원칙 3가지</h3><p class="small">예시와 직접 입력을 합해 3개를 골라요.</p>${rules.map((r,i)=>`<label class="check"><input type="checkbox" data-rule="${i}" ${state.rules.includes(i)?'checked':''}>${r}</label>`).join('')}<label for="custom-rule">내가 직접 쓴 원칙 1개</label><input id="custom-rule" maxlength="100" value="${esc(state.customRule)}" placeholder="예시 2개 + 나만의 원칙 1개도 좋아요"><label for="pledge">다짐 한 줄</label><input id="pledge" maxlength="140" value="${esc(state.pledge)}"><p id="plan-error" role="alert"></p>${button('내 재무계획서 완성','finish',true)}`;}
function updateGoals(){let m=amounts()[5],total=0;state.goals.forEach((g,i)=>{let n=Calc.goal(g.amount,g.months);total+=n;let e=root.querySelector('#goal-result-'+i);if(e)e.textContent=`필요한 월 저축액 ${won(n)} · ${n<=m?'개별 목표 가능':'월 저축 예산 초과'}`;});let e=root.querySelector('#goal-total');if(e)e.textContent=`현재 예산의 10년 세후 저축 전망 ${won(Calc.future(m,Assumptions.futureRate).net)}. 세 목표를 동시에 준비하면 월 ${won(total)} / 내 저축 예산 ${won(m)} → ${total<=m?'가능':'목표 금액이나 월 저축 조정 필요'}`;}

root.addEventListener('input',e=>{let el=e.target;if(el.id==='guess'){state.guess=+el.value;root.querySelector('#guess-value').textContent=won(state.guess);}if(el.dataset.budget!==undefined){let i=+el.dataset.budget;state.budget[i]=Math.min(net(),Math.max(0,Math.floor(Number(el.value)||0)));state.housing=state.budget[0];updateBudget();updateGoals();}if(el.id==='chart-monthly'||el.id==='chart-rate'){if(el.id==='chart-monthly')state.chartMonthly=+el.value;else state.chartRate=+el.value;root.querySelector('#chart-monthly-label').textContent=won(state.chartMonthly);root.querySelector('#chart-rate-label').textContent=state.chartRate+'%';root.querySelector('#chart').innerHTML=graph();}if(el.dataset.goalTitle!==undefined)state.goals[+el.dataset.goalTitle].title=el.value;if(el.dataset.goalAmount!==undefined){state.goals[+el.dataset.goalAmount].amount=Math.min(1e9,Math.max(0,floor(+el.value||0)));updateGoals();}if(el.id==='custom-rule')state.customRule=el.value;if(el.id==='pledge')state.pledge=el.value;persist();});

 const GR={plain:[C('#67ad49'),C('#579a3e'),C('#7cc25a'),C('#4c8a36')],market:[C('#6fb04a'),C('#5c9a3c'),C('#86c45e'),C('#4c8a36')],bank:[C('#62a64a'),C('#52923e'),C('#78ba5c'),C('#4c8a36')],autumn:[C('#a3ae4e'),C('#8c9a40'),C('#bcc464'),C('#7a8a36')],meadow:[C('#70b850'),C('#5ea442'),C('#88cc66'),C('#4c8a36')]};
 const PB=C('#d9b47c'),PD=C('#c69e66'),PL=C('#e8c993'),PS=C('#a8875a'),SB=C('#bdb8ae'),SG=C('#8f8a82'),SL=C('#d4d0c8'),WB=C('#3d7fc0'),WD=C('#3672b0'),WL=C('#73b3e8'),DT=C('#8a6440'),DD=C('#6e4e30'),DK=C('#4e3420'),FO=C('#d6eef9'),SO=C('#7a5634'),SF=C('#5e4026'),SPR1=C('#6cbc55'),SPR2=C('#4f9a3f'),CAR=C('#e38a3c'),LF=[C('#d9822b'),C('#c8502e'),C('#e0b03a')];
