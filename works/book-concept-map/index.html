<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>책 개념 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app" class="wrap"></main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="vbar">
    <button class="btn" id="vClose">← 지도로</button>
    <div class="vhead">
      <span class="vch" id="vCh"></span>
      <span class="vtitle" id="vTitle"></span>
    </div>
    <div class="vnav">
      <button class="btn icon" id="vPrev" aria-label="이전 프로그램">‹</button>
      <button class="btn icon" id="vNext" aria-label="다음 프로그램">›</button>
      <a class="btn" id="vOpen" target="_blank" rel="noopener">새 창</a>
    </div>
  </div>
  <iframe id="vFrame" title="프로그램"></iframe>
</div>

<script src="data/books.js"></script>
<script src="app.js"></script>
</body>
</html>
